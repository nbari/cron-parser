[package]
name = "cron-parser"
version = "0.12.0"
authors = ["Nicolas Embriz <nbari@tequila.io>"]
description = "Library for parsing cron expressions with timezone support."
documentation = "https://docs.rs/cron-parser/latest/cron_parser/"
homepage = "https://docs.rs/cron-parser"
repository = "https://github.com/nbari/cron-parser"
readme = "README.md"
keywords = ["cron", "crontab", "parser"]
categories = ["parsing", "date-and-time"]
license = "BSD-3-Clause"
edition = "2024"

[lints.rust]
warnings = "deny"

[lints.clippy]
# Allow unstable/opinionated lints (lower priority so individual lints can override)
nursery = { level = "allow", priority = -1 }

# Enforce pedantic lints
pedantic = "deny"

# Core lint groups
all = "deny"
correctness = "deny"
suspicious = "deny"
perf = "deny"
complexity = "deny"

# Safety-critical lints
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
await_holding_lock = "deny"

# Performance + memory reliability
needless_borrow = "deny"
needless_collect = "deny"
large_stack_arrays = "deny"

[dependencies]
jiff = { version = "1", default-features = false, features = ["std"] }

[dev-dependencies]
# Tests, examples and benchmarks use the bundled time zone database only, so
# their results do not depend on the tzdata installed on the host.
jiff = { version = "1", default-features = false, features = [
    "std",
    "tz-fat",
    "tzdb-bundle-always",
    "perf-inline",
] }
criterion = "0.8"
proptest = "1"

[[bench]]
name = "parse_benchmark"
harness = false
